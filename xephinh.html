<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AI Tetris Mobile Pro</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    :root {
      /* Dark Theme Default */
      --bg1: #1a263b;
      --bg2: #05070f;
      --card: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.15);
      --card-active: rgba(255, 255, 255, 0.2);
      --text: #ffffff;
      --text-muted: #8b9fb0;
      
      /* Neon Theme Colors */
      --accent: #61e8ff;
      --danger: #ff6b8a;
      
      /* Environment variables cho tai thỏ/thanh vuốt iOS */
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      
      --app-h: 100vh;
    }

    /* Light Mode Variables */
    body[data-mode="light"] {
      --bg1: #e6f0fa;
      --bg2: #f0f5fa;
      --card: #ffffff;
      --card-border: rgba(0, 0, 0, 0.1);
      --card-active: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
    }

    /* Color Themes */
    body[data-theme="neon"] { --accent: #61e8ff; --danger: #ff6b8a; }
    body[data-theme="pastel"] { --accent: #c084fc; --danger: #fb7185; }
    body[data-theme="matrix"] { --accent: #22c55e; --danger: #eab308; }
    body[data-theme="sunset"] { --accent: #f97316; --danger: #e11d48; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: radial-gradient(circle at top, var(--bg1), var(--bg2) 80%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: none; /* Chặn zoom/scroll trên mobile */
    }

    /* Layout chính */
    .app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: var(--app-h);
      display: flex;
      flex-direction: column;
      padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
    }

    /* Khu vực Canvas */
    .game-section {
      flex: 1;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      position: relative;
      padding: 10px;
    }

    canvas {
      height: 100%;
      max-height: 100%;
      width: auto;
      aspect-ratio: 1 / 2;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      border: 1px solid var(--card-border);
    }

    /* HUD (Hiển thị điểm số đè lên Game) */
    .hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }

    .hud-box {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .hud-label {
      font-size: 10px;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .hud-value {
      font-size: 16px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
    }

    .status-chip {
      background: rgba(0, 0, 0, 0.65);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      color: white;
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* Khu vực điều khiển */
    .controls-section {
      height: clamp(200px, 32vh, 280px); /* Tăng chiều cao để nút to hơn */
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      gap: 8px;
      padding: 5px 10px 15px 10px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .panel-title {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    /* D-PAD Dấu cộng */
    .dpad-container {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 4px;
      align-items: stretch;
    }

    .btn {
      background: var(--card-border);
      border: none;
      border-radius: 10px;
      color: var(--text);
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.05s, background 0.1s;
      cursor: pointer;
    }

    .btn:active {
      transform: scale(0.92);
      background: var(--card-active);
    }

    .btn-move { font-size: 20px; }
    .btn.up { grid-column: 2; grid-row: 1; }
    .btn.left { grid-column: 1; grid-row: 2; }
    .btn.down { grid-column: 2; grid-row: 3; }
    .btn.right { grid-column: 3; grid-row: 2; }

    /* Action Panel */
    .action-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 10px;
    }

    .btn-action {
      font-size: 24px;
      border-radius: 12px;
      font-weight: 900;
    }

    .btn-a { background: var(--accent); color: #000; }
    .btn-b { background: var(--danger); color: #fff; }
    
    .btn-a:active { background: var(--accent); filter: brightness(1.2); }
    .btn-b:active { background: var(--danger); filter: brightness(1.2); }

    /* Center Settings Panel */
    .settings-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
    }

    .setting-row {
      background: rgba(0,0,0,0.15);
      border-radius: 8px;
      padding: 6px 8px;
    }

    body[data-mode="light"] .setting-row {
      background: rgba(0,0,0,0.03);
    }

    .setting-label {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .setting-value { color: var(--text); }

    input[type=range] {
      width: 100%;
      accent-color: var(--accent);
      height: 4px;
      margin: 5px 0;
    }

    .next-ai-row {
      display: flex;
      gap: 6px;
      height: 40px;
    }

    .next-box, .ai-btn-wrap {
      flex: 1;
      background: rgba(0,0,0,0.15);
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .next-piece {
      display: grid;
      grid-template-columns: repeat(4, 8px);
      grid-auto-rows: 8px;
      gap: 1px;
    }
    .next-cell { width: 8px; height: 8px; border-radius: 2px; }

    .btn-ai {
      width: 100%;
      height: 100%;
      background: var(--accent);
      color: #000;
      font-size: 12px;
      font-weight: 900;
      border: none;
      border-radius: 8px;
    }
    .btn-ai.off { background: var(--danger); color: #fff; }

    .theme-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin-top: auto;
    }

    .btn-theme {
      font-size: 9px;
      padding: 6px 0;
      border-radius: 6px;
      background: var(--card-border);
    }
    .btn-theme.active {
      box-shadow: 0 0 0 2px var(--accent);
      background: rgba(0,0,0,0.3);
    }
    
    .btn-mode {
      margin-top: 4px;
      font-size: 10px;
      padding: 6px;
      width: 100%;
      border-radius: 6px;
    }

    /* Responsive cho màn hình ngang (Landscape) */
    @media (orientation: landscape) and (max-height: 500px) {
      .app {
        flex-direction: row;
      }
      .controls-section {
        height: 100%;
        width: 320px;
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr auto;
        overflow-y: auto;
      }
      .panel-title { display: none; }
      .dpad-container { height: 140px; }
      .action-container { height: 100px; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
    }

  </style>
</head>
<body data-mode="dark" data-theme="neon">

  <main class="app">
    <!-- Game Canvas & HUD -->
    <section class="game-section">
      <div class="hud">
        <div class="hud-box">
          <span class="hud-label">Score</span>
          <span class="hud-value" id="scoreUI">0</span>
        </div>
        <div class="status-chip" id="statusChip">AI ACTIVE</div>
        <div class="hud-box" style="align-items: flex-end;">
          <span class="hud-label">Lines</span>
          <span class="hud-value" id="linesUI">0</span>
        </div>
      </div>
      <canvas id="game"></canvas>
    </section>

    <!-- Controls -->
    <section class="controls-section">
      
      <!-- L Panel: Move -->
      <div class="panel">
        <div class="panel-title">MOVE</div>
        <div class="dpad-container">
          <button id="btnUp" class="btn btn-move up">▲</button>
          <button id="btnLeft" class="btn btn-move left">◀</button>
          <button id="btnDown" class="btn btn-move down">▼</button>
          <button id="btnRight" class="btn btn-move right">▶</button>
        </div>
      </div>

      <!-- C Panel: Stats & Settings -->
      <div class="panel" style="padding: 6px;">
        <div class="settings-container">
          <div class="next-ai-row">
            <div class="next-box"><div id="nextPiece" class="next-piece"></div></div>
            <div class="ai-btn-wrap"><button id="aiToggleBtn" class="btn btn-ai">AI ON</button></div>
          </div>
          
          <div class="setting-row">
            <div class="setting-label"><span>Risk Level</span><span class="setting-value" id="riskValue">1.0x</span></div>
            <input id="riskRange" type="range" min="0.2" max="2.2" step="0.1" value="1.0">
          </div>

          <div class="setting-row">
            <div class="setting-label"><span>Game Speed</span><span class="setting-value" id="speedValue">1.0x</span></div>
            <input id="speedRange" type="range" min="0.5" max="2.5" step="0.1" value="1.0">
          </div>

          <div class="theme-row">
            <button class="btn btn-theme active" data-theme="neon">Neon</button>
            <button class="btn btn-theme" data-theme="pastel">Pastel</button>
            <button class="btn btn-theme" data-theme="matrix">Matrix</button>
            <button class="btn btn-theme" data-theme="sunset">Sunset</button>
          </div>
          <button id="modeBtn" class="btn btn-mode">Toggle Light/Dark</button>
        </div>
      </div>

      <!-- R Panel: Rotate -->
      <div class="panel">
        <div class="panel-title">ACTION</div>
        <div class="action-container">
          <button id="btnA" class="btn btn-action btn-a">A</button>
          <button id="btnB" class="btn btn-action btn-b">B</button>
        </div>
      </div>

    </section>
  </main>

<script>
// --- CỐ ĐỊNH CHIỀU CAO CHO MOBILE BROWSER ---
function updateViewportHeight() {
  const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  document.documentElement.style.setProperty("--app-h", `${h}px`);
}
window.addEventListener("resize", updateViewportHeight);
if(window.visualViewport) window.visualViewport.addEventListener("resize", updateViewportHeight);
updateViewportHeight();

// --- KHỞI TẠO CANVAS ---
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// Kích thước logic chuẩn của Tetris board
const W = 10;
const H = 20;
const CELL = 34; // Kích thước 1 ô pixel ảo
const VIEW_W = W * CELL;
const VIEW_H = H * CELL;

// Xử lý độ nét trên màn hình Retina
const DPR = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = VIEW_W * DPR;
canvas.height = VIEW_H * DPR;
ctx.scale(DPR, DPR);

// --- DOM ELEMENTS ---
const elScore = document.getElementById("scoreUI");
const elLines = document.getElementById("linesUI");
const statusChip = document.getElementById("statusChip");
const nextPiece = document.getElementById("nextPiece");

const speedRange = document.getElementById("speedRange");
const speedValue = document.getElementById("speedValue");
const riskRange = document.getElementById("riskRange");
const riskValue = document.getElementById("riskValue");
const aiToggleBtn = document.getElementById("aiToggleBtn");
const modeBtn = document.getElementById("modeBtn");
const themeButtons = [...document.querySelectorAll(".btn-theme")];

// Nút điều khiển
const btnLeft = document.getElementById("btnLeft");
const btnRight = document.getElementById("btnRight");
const btnDown = document.getElementById("btnDown");
const btnUp = document.getElementById("btnUp");
const btnA = document.getElementById("btnA");
const btnB = document.getElementById("btnB");

// --- TRẠNG THÁI UI ---
let visualTheme = "neon";
let visualMode = "dark";
let speedFactor = 1;
let riskFactor = 1;
let aiEnabled = true;
let paused = false;

// Theme Colors
const THEME_PRESETS = {
  neon: { accent: "#61e8ff", danger: "#ff6b8a" },
  pastel: { accent: "#c084fc", danger: "#fb7185" },
  matrix: { accent: "#22c55e", danger: "#eab308" },
  sunset: { accent: "#f97316", danger: "#e11d48" }
};
const PIECE_COLORS = {
  neon: { I: "#61e8ff", O: "#ffe66d", T: "#c084fc", S: "#70f0a2", Z: "#ff6b8a", J: "#60a5fa", L: "#ffb86b" },
  pastel: { I: "#93c5fd", O: "#fde68a", T: "#d8b4fe", S: "#bbf7d0", Z: "#fda4af", J: "#bfdbfe", L: "#fed7aa" },
  matrix: { I: "#8cffc1", O: "#d9ff70", T: "#70f0a2", S: "#48ff80", Z: "#facc15", J: "#2dd4bf", L: "#a3e635" },
  sunset: { I: "#ffd166", O: "#ffe66d", T: "#ff8fab", S: "#fca311", Z: "#ff4d6d", J: "#ffb86b", L: "#fb8500" }
};

function colorOf(type) { return PIECE_COLORS[visualTheme][type]; }
function theme() { return THEME_PRESETS[visualTheme]; }

// UI Event Listeners
themeButtons.forEach(btn => {
  btn.addEventListener("click", () => {
    visualTheme = btn.dataset.theme;
    document.body.dataset.theme = visualTheme;
    themeButtons.forEach(x => x.classList.toggle("active", x === btn));
  });
});

modeBtn.addEventListener("click", () => {
  visualMode = visualMode === "dark" ? "light" : "dark";
  document.body.dataset.mode = visualMode;
});

speedRange.addEventListener("input", () => { speedFactor = Number(speedRange.value); speedValue.textContent = speedFactor.toFixed(1) + "x"; });
riskRange.addEventListener("input", () => { riskFactor = Number(riskRange.value); riskValue.textContent = riskFactor.toFixed(1) + "x"; });

aiToggleBtn.addEventListener("click", () => {
  aiEnabled = !aiEnabled;
  aiToggleBtn.textContent = aiEnabled ? "AI ON" : "AI OFF";
  aiToggleBtn.classList.toggle("off", !aiEnabled);
  manualOverrideMs = aiEnabled ? 0 : 999999;
});

// Hàm gán sự kiện chạm giữ nút
function bindHoldButton(button, action, repeatMs = 95, repeat = true) {
  let timer = null;
  const stop = () => { if (timer) { clearInterval(timer); timer = null; } };
  button.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    action();
    if (repeat) { stop(); timer = setInterval(action, repeatMs); }
  });
  button.addEventListener("pointerup", stop);
  button.addEventListener("pointercancel", stop);
  button.addEventListener("pointerleave", stop);
}

// --- TETRIS LOGIC ---
const SHAPES = {
  I: [[1, 1, 1, 1]],
  O: [[1, 1], [1, 1]],
  T: [[0, 1, 0], [1, 1, 1]],
  S: [[0, 1, 1], [1, 1, 0]],
  Z: [[1, 1, 0], [0, 1, 1]],
  J: [[1, 0, 0], [1, 1, 1]],
  L: [[0, 0, 1], [1, 1, 1]]
};

function rotateCW(matrix) { return matrix[0].map((_, i) => matrix.map(row => row[i]).reverse()); }
function matrixKey(matrix) { return matrix.map(row => row.join("")).join("/"); }
function getRotations(shape) {
  const result = [], seen = new Set();
  let m = shape;
  for (let i = 0; i < 4; i++) {
    const key = matrixKey(m);
    if (!seen.has(key)) { seen.add(key); result.push(m); }
    m = rotateCW(m);
  }
  return result;
}
const ROTATIONS = {};
for (const type in SHAPES) ROTATIONS[type] = getRotations(SHAPES[type]);

let board, bag = [], nextQueue = [], current = null, target = null;
let score = 0, totalLines = 0, combo = 0, pieceIndex = 0;
let particles = [], flashes = [], messages = [];
let lastTime = 0, dropCounter = 0, botCounter = 0, slowmo = 0, shake = 0;
const PREVIEW_COUNT = 5;

// Drama/AI system
const PHASES = { CALM: "CALM", SETUP: "SETUP", TENSION: "TENSION", CRISIS: "CRISIS", RECOVERY: "RECOVERY", PAYOFF: "PAYOFF" };
let drama = { phase: PHASES.CALM, risk: 0, planText: "Clean stack", controlText: "Stable" };
let recoveryMode = 0;
let execution = { activeError: null, offsetDir: 0, delayFrames: 0, lastErrorPiece: -999, nextErrorAt: 9, minGap: 9 };
let manualOverrideMs = 0;

function createBoard() { return Array.from({ length: H }, () => Array(W).fill(null)); }
function shuffle(arr) { const a = arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function nextType() { if (bag.length === 0) bag = shuffle(Object.keys(SHAPES)); return bag.pop(); }
function fillQueue() { while (nextQueue.length < PREVIEW_COUNT) nextQueue.push(nextType()); }
function cloneBoard(b) { return b.map(row => row.map(cell => cell ? { ...cell } : null)); }

function collisionOn(b, shape, px, py) {
  for (let y = 0; y < shape.length; y++) {
    for (let x = 0; x < shape[y].length; x++) {
      if (!shape[y][x]) continue;
      const nx = px + x, ny = py + y;
      if (nx < 0 || nx >= W || ny >= H) return true;
      if (ny >= 0 && b[ny][nx]) return true;
    }
  }
  return false;
}
function collision(shape, px, py) { return collisionOn(board, shape, px, py); }

function placeAndClear(b, shape, px, py, type) {
  for (let y = 0; y < shape.length; y++) {
    for (let x = 0; x < shape[y].length; x++) {
      if (!shape[y][x]) continue;
      const nx = px + x, ny = py + y;
      if (ny >= 0 && ny < H && nx >= 0 && nx < W) b[ny][nx] = { type };
    }
  }
  let cleared = 0;
  for (let y = H - 1; y >= 0; y--) {
    if (b[y].every(Boolean)) {
      b.splice(y, 1); b.unshift(Array(W).fill(null)); cleared++; y++;
    }
  }
  return cleared;
}

// AI Evaluation (Giữ nguyên logic gốc)
function getColumnHeights(b) { const heights = Array(W).fill(0); for(let x=0;x<W;x++){for(let y=0;y<H;y++){if(b[y][x]){heights[x]=H-y;break;}}} return heights; }
function getMaxHeight(b) { return Math.max(...getColumnHeights(b)); }
function countHoles(b) { let holes=0; for(let x=0;x<W;x++){let seen=false; for(let y=0;y<H;y++){if(b[y][x])seen=true; else if(seen)holes++;}} return holes; }
function countWells(b) { let wells=0; for(let x=0;x<W;x++){for(let y=0;y<H;y++){if(b[y][x])continue; const l=x===0||b[y][x-1], r=x===W-1||b[y][x+1]; if(l&&r)wells++;}} return wells; }
function getDangerLevel(b) { return Math.min(1, getMaxHeight(b)/18 + Math.min(countHoles(b)/8, 1)*0.45); }
function hasTetrisWell(b) {
  const h = getColumnHeights(b);
  for(let x=0;x<W;x++){
    const l = x===0?20:h[x-1], r = x===W-1?20:h[x+1];
    if(l>=4 && r>=4 && h[x]<=Math.max(l,r)-3) return true;
  }
  return false;
}
function evaluateBoard(b, cleared) {
  const h = getColumnHeights(b);
  let bumpiness = 0; for(let i=0;i<W-1;i++) bumpiness += Math.abs(h[i]-h[i+1]);
  let val = cleared*1100 + (cleared===4?2800:0) - countHoles(b)*900 - h.reduce((a,n)=>a+n,0)*26 - bumpiness*52 - Math.max(...h)*38 + countWells(b)*18;
  return val;
}
function getAllMoves(b, type) {
  const moves = [];
  ROTATIONS[type].forEach((shape, r) => {
    for(let x = -shape[0].length; x <= W; x++){
      let y = -4; while(!collisionOn(b, shape, x, y+1)) y++;
      if(collisionOn(b, shape, x, y)) continue;
      const sim = cloneBoard(b);
      const cleared = placeAndClear(sim, shape, x, y, type);
      moves.push({x, y, rot: r, cleared, score: evaluateBoard(sim, cleared)});
    }
  });
  return moves;
}
function chooseMove(b, type) {
  const moves = getAllMoves(b, type).sort((a,b)=>b.score-a.score);
  return moves[0] || {x:4,y:0,rot:0,cleared:0,score:0};
}

// User Actions
function setManualOverride(label) {
  manualOverrideMs = 850; drama.controlText = label;
}
function userNudge(dx) {
  if(!current) return;
  if(!collision(current.shape, current.x+dx, current.y)) {
    current.x+=dx; setManualOverride(dx<0?"Left":"Right");
  }
}
function userSoftDrop() { if(!current)return; setManualOverride("Drop"); softDrop(); }
function userHardDrop() {
  if(!current)return; setManualOverride("Hard Drop");
  while(!collision(current.shape, current.x, current.y+1)) current.y++;
  lockPiece() ? spawnPiece() : resetGame();
}
function userRotate(dir) {
  if(!current)return;
  const rots = ROTATIONS[current.type];
  const nextRot = (current.rot + dir + rots.length) % rots.length;
  const nextShape = rots[nextRot];
  for(let k of [0,-1,1,-2,2]) {
    if(!collision(nextShape, current.x+k, current.y)){
      current.rot=nextRot; current.shape=nextShape; current.x+=k;
      setManualOverride("Rotate"); return;
    }
  }
}

bindHoldButton(btnLeft, () => userNudge(-1));
bindHoldButton(btnRight, () => userNudge(1));
bindHoldButton(btnDown, userSoftDrop, 55);
bindHoldButton(btnUp, userHardDrop, 120, false);
bindHoldButton(btnA, () => userRotate(1), 115);
bindHoldButton(btnB, () => userRotate(-1), 115);

// Game Flow
function spawnPiece() {
  fillQueue();
  const type = nextQueue.shift(); fillQueue();
  current = { type, rot: 0, shape: ROTATIONS[type][0], x: Math.floor((W-ROTATIONS[type][0][0].length)/2), y: -2 };
  pieceIndex++;
  target = chooseMove(board, type);
  if(collision(current.shape, current.x, current.y)) resetGame();
}

function botStep() {
  if(!current || !target || !aiEnabled || manualOverrideMs > 0) return;
  if(current.rot !== target.rot) { userRotate(1); return; }
  if(current.x !== target.x) {
    const dir = current.x < target.x ? 1 : -1;
    if(!collision(current.shape, current.x+dir, current.y)) current.x+=dir;
  }
}

function softDrop() {
  if(!current) return;
  current.y++;
  if(collision(current.shape, current.x, current.y)) {
    current.y--;
    lockPiece() ? spawnPiece() : resetGame();
  }
}

function lockPiece() {
  let overflow = false;
  for(let y=0; y<current.shape.length; y++) {
    for(let x=0; x<current.shape[y].length; x++){
      if(!current.shape[y][x]) continue;
      const nx = current.x+x, ny = current.y+y;
      if(ny < 0) overflow = true;
      else if(ny<H && nx>=0 && nx<W) board[ny][nx] = {type: current.type};
    }
  }
  if(overflow) return false;
  
  let cleared = 0;
  for (let y = H - 1; y >= 0; y--) {
    if (board[y].every(Boolean)) {
      board.splice(y, 1); board.unshift(Array(W).fill(null));
      flashes.push({y, life:280, max:280});
      makeLineParticles(y);
      cleared++; y++;
    }
  }

  if(cleared > 0) {
    combo++; totalLines += cleared;
    score += cleared * cleared * 100 * combo;
    slowmo = cleared === 4 ? 500 : 200;
    shake = cleared === 4 ? 10 : 3;
    addMessage(cleared===4?"TETRIS!":`+${cleared}`, theme().accent);
  } else {
    combo = 0; score += 10;
  }
  return true;
}

// Effects & Drawing
function makeLineParticles(row) {
  for(let x=0; x<W; x++){
    if(Math.random()>0.5) continue;
    particles.push({
      x: x*CELL + CELL/2, y: row*CELL + CELL/2,
      vx: (Math.random()-0.5)*5, vy: -Math.random()*4-1,
      life: 600, max: 600, size: Math.random()*3+2, color: theme().accent
    });
  }
}

function addMessage(text, color) {
  messages.push({text, color, x: VIEW_W/2, y: VIEW_H/2, life: 800, max: 800});
}

function drawBlock(gx, gy, color, alpha=1) {
  if(gy<0) return;
  const pad = 1, size = CELL - pad*2;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.shadowColor = color; ctx.shadowBlur = alpha===1?10:0;
  ctx.beginPath(); ctx.roundRect(gx*CELL+pad, gy*CELL+pad, size, size, 4); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.2)"; ctx.lineWidth=1; ctx.stroke();
  ctx.restore();
}

function updateUI() {
  elScore.innerText = score.toLocaleString();
  elLines.innerText = totalLines;
  
  // Update Next Piece Miniature
  const nextType = nextQueue[0] || "I";
  nextPiece.innerHTML = "";
  const shape = ROTATIONS[nextType][0];
  for (let y = 0; y < 2; y++) {
    for (let x = 0; x < 4; x++) {
      const cell = document.createElement("div");
      cell.className = "next-cell";
      if (shape[y] && shape[y][x]) {
        cell.style.background = colorOf(nextType);
        cell.style.boxShadow = `0 0 5px ${colorOf(nextType)}`;
      }
      nextPiece.appendChild(cell);
    }
  }

  statusChip.innerText = !aiEnabled ? "MANUAL" : (paused ? "PAUSED" : drama.controlText);
}

function draw() {
  ctx.clearRect(0,0, VIEW_W, VIEW_H);
  
  if(shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  
  // Lưới nền mờ
  ctx.strokeStyle = "rgba(255,255,255,0.05)"; ctx.lineWidth=1;
  ctx.beginPath();
  for(let x=1; x<W; x++) { ctx.moveTo(x*CELL, 0); ctx.lineTo(x*CELL, VIEW_H); }
  for(let y=1; y<H; y++) { ctx.moveTo(0, y*CELL); ctx.lineTo(VIEW_W, y*CELL); }
  ctx.stroke();

  // Vẽ Board
  for(let y=0; y<H; y++) for(let x=0; x<W; x++) if(board[y][x]) drawBlock(x, y, colorOf(board[y][x].type));
  
  // Vẽ Ghost & Current
  if(current) {
    let gy = current.y;
    while(!collision(current.shape, current.x, gy+1)) gy++;
    for(let y=0; y<current.shape.length; y++) for(let x=0; x<current.shape[y].length; x++) {
      if(current.shape[y][x]) {
        drawBlock(current.x+x, gy+y, "#ffffff", 0.15); // Ghost
        drawBlock(current.x+x, current.y+y, colorOf(current.type), 1); // Real
      }
    }
  }

  // Vẽ Flash dòng xoá
  for(let f of flashes) {
    ctx.fillStyle = `rgba(255,255,255,${(f.life/f.max)*0.8})`;
    ctx.fillRect(0, f.y*CELL, VIEW_W, CELL);
  }

  // Vẽ Particles
  for(let p of particles) {
    ctx.fillStyle = p.color; ctx.globalAlpha = p.life/p.max;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Vẽ Messages
  ctx.textAlign = "center"; ctx.font = "900 24px system-ui";
  for(let m of messages) {
    ctx.fillStyle = m.color; ctx.globalAlpha = m.life/m.max;
    ctx.shadowColor = m.color; ctx.shadowBlur = 10;
    ctx.fillText(m.text, m.x, m.y);
  }
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;

  if(shake > 0) ctx.setTransform(DPR, 0, 0, DPR, 0, 0); // Reset transform
}

function loop(time = 0) {
  const rawDt = time - lastTime || 16;
  lastTime = time;

  if (!paused) {
    if(manualOverrideMs > 0) manualOverrideMs -= rawDt;
    const dt = rawDt * speedFactor * (slowmo > 0 ? 0.3 : 1);
    if(slowmo > 0) slowmo -= rawDt;
    if(shake > 0) shake -= rawDt*0.05;

    botCounter += dt; dropCounter += dt;
    if(botCounter > 60) { botStep(); botCounter = 0; }
    
    // Tốc độ rơi phụ thuộc AI Target đã tới chưa
    const isTargetReached = target && current && current.x===target.x && current.rot===target.rot;
    if(dropCounter > (isTargetReached ? 40 : 350)) { softDrop(); dropCounter = 0; }

    // Update Particles/Messages
    particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=0.1; p.life-=dt; });
    particles = particles.filter(p=>p.life>0);
    flashes.forEach(f => f.life-=dt); flashes = flashes.filter(f=>f.life>0);
    messages.forEach(m => { m.y-=0.05*dt; m.life-=dt; }); messages = messages.filter(m=>m.life>0);
    
    // Tính trạng thái (Drama)
    drama.risk = getDangerLevel(board);
    drama.controlText = (aiEnabled && manualOverrideMs<=0) ? (drama.risk>0.6?"CRISIS":"STABLE") : "MANUAL";
  }

  updateUI();
  draw();
  requestAnimationFrame(loop);
}

function resetGame() {
  board = createBoard(); bag = []; nextQueue = [];
  score = 0; totalLines = 0; combo = 0;
  particles = []; flashes = []; messages = [];
  fillQueue(); spawnPiece();
}

// Double tap canvas để Pause
let lastTap = 0;
canvas.addEventListener("pointerdown", (e) => {
  const now = Date.now();
  if(now - lastTap < 300) { paused = !paused; e.preventDefault(); }
  lastTap = now;
});

resetGame();
requestAnimationFrame(loop);
</script>
