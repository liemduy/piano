<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07060A" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lofi Tetris" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>Lofi AI Tetris - Sleep Mode</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    :root {
      /* Bảng màu Sleep / Lofi */
      --bg1: #1a1829;
      --bg2: #07060a;
      --bg-solid: #07060a;
      --card: rgba(255, 255, 255, 0.03);
      --card2: rgba(255, 255, 255, 0.05);
      --text: #d4d2dc;
      --muted: #807d91;
      --accent: #b2a4d4; /* Tím nhạt mộng mơ */
      --danger: #d4a4b2; /* Hồng đào dịu */
      --success: #a4d4b8;
      --warning: #d4c8a4;
      --app-h: 100dvh;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --controls-h: clamp(160px, 22vh, 180px);
      --app-gap: 8px;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: var(--bg-solid);
      background: radial-gradient(circle at 50% 0%, var(--bg1), var(--bg2) 80%);
      color: var(--text);
      font-family: 'Quicksand', system-ui, sans-serif;
      touch-action: manipulation;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -40px 0;
      z-index: -1;
      background-color: var(--bg-solid);
      background: radial-gradient(circle at 50% 0, var(--bg1), var(--bg2) 72%);
    }

    .app {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: var(--app-h);
      min-height: 100dvh;
      display: grid;
      grid-template-rows: minmax(0, 1fr) var(--controls-h);
      gap: var(--app-gap);
      padding:
        max(12px, var(--safe-top))
        max(12px, var(--safe-right))
        max(12px, var(--safe-bottom))
        max(12px, var(--safe-left));
      overflow: hidden;
    }

    .app.controls-collapsed {
      grid-template-rows: minmax(0, 1fr);
      padding-bottom: max(32px, var(--safe-bottom));
    }

    .app.controls-collapsed .controls-wrap {
      display: none;
    }

    .game-wrap {
      min-height: 0;
      min-width: 0;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      background: rgba(0, 0, 0, 0.2);
      box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
    }

    canvas {
      width: min(100%, 360px);
      height: auto;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 1 / 2;
      display: block;
      border-radius: 12px;
      touch-action: none;
      opacity: 0.95;
    }

    .overlay-chip {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(8px);
      color: var(--text);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      pointer-events: none;
      white-space: nowrap;
      transition: all 0.5s ease;
      opacity: 0.8;
    }

    .control-toggle {
      position: absolute;
      top: max(20px, calc(var(--safe-top) + 12px));
      right: max(20px, calc(var(--safe-right) + 12px));
      z-index: 5;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: none;
      border-radius: 999px;
      background: var(--card2);
      color: var(--muted);
      backdrop-filter: blur(12px);
      font-size: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .control-toggle:active {
      transform: scale(0.9);
      background: var(--card);
    }

    .app.controls-collapsed .control-toggle {
      color: var(--accent);
      background: rgba(178, 164, 212, 0.1);
    }

    .collapsed-actions {
      position: absolute;
      top: max(70px, calc(var(--safe-top) + 60px));
      right: max(20px, calc(var(--safe-right) + 12px));
      z-index: 5;
      display: none;
      grid-template-rows: repeat(2, 36px);
      gap: 8px;
    }

    .app.controls-collapsed .collapsed-actions {
      display: grid;
    }

    .mini-action {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: none;
      border-radius: 999px;
      background: var(--card2);
      color: var(--muted);
      backdrop-filter: blur(12px);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    
    .mini-action.bomb { background: rgba(212, 164, 178, 0.15); color: var(--danger); }
    .mini-action.laser { background: rgba(212, 200, 164, 0.15); color: var(--warning); }
    .mini-action:disabled { opacity: 0.3; }

    .controls-wrap {
      min-height: 0;
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(80px, 0.9fr) minmax(130px, 1.22fr) minmax(80px, 0.82fr);
      gap: 8px;
      overflow: hidden;
      align-items: stretch;
      opacity: 0.8;
      transition: opacity 0.5s ease;
    }
    
    .controls-wrap:active, .controls-wrap:focus-within {
        opacity: 1;
    }

    .panel {
      border-radius: 20px;
      background: var(--card);
      backdrop-filter: blur(16px);
      padding: 8px;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 6px;
    }

    .controls-wrap > .panel:nth-child(2) {
      grid-template-rows: minmax(0, 1fr);
    }

    .title {
      height: 12px;
      margin-bottom: 2px;
      color: rgba(255,255,255,0.2);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      text-align: center;
      line-height: 1;
    }

    .pad {
      min-height: 0;
      display: grid;
      place-items: center;
    }

    .dpad {
      width: min(100%, 120px);
      height: min(100%, 120px);
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      place-self: center;
    }

    .pad-btn, .action-btn, .ai-toggle {
      border: none;
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
      color: var(--muted);
      font-weight: 600;
      display: grid;
      place-items: center;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .pad-btn:active, .action-btn:active, .ai-toggle:active {
      transform: scale(0.92);
      background: rgba(255,255,255,0.1);
      color: var(--text);
    }

    .pad-btn {
      font-size: 16px;
      width: 100%;
      height: 100%;
      border-radius: 12px;
    }

    .pad-btn.up { grid-column: 2; grid-row: 1; }
    .pad-btn.left { grid-column: 1; grid-row: 2; }
    .pad-btn.down { grid-column: 2; grid-row: 3; }
    .pad-btn.right { grid-column: 3; grid-row: 2; }

    .action-pad {
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 8px;
      align-items: stretch;
    }

    .action-btn {
      font-size: 18px;
      border-radius: 16px;
      color: var(--accent);
      background: rgba(178, 164, 212, 0.08);
    }

    .action-btn.secondary { color: var(--danger); background: rgba(212, 164, 178, 0.08); }
    .action-btn.utility { color: var(--success); background: rgba(164, 212, 184, 0.08); }
    .action-btn.beam { color: var(--warning); background: rgba(212, 200, 164, 0.08); }
    .action-btn:disabled { opacity: 0.3; transform: none; filter: grayscale(1); font-size: 14px; }

    .center-stack {
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(28px, 0.8fr) minmax(28px, 0.8fr) minmax(40px, 1fr) minmax(36px, 0.9fr);
      gap: 6px;
    }

    .mini-card {
      min-height: 0;
      padding: 6px 10px;
      border-radius: 14px;
      background: rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .size-card {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 4px;
    }

    .size-stepper {
      min-height: 0;
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) 36px;
      gap: 6px;
      align-items: stretch;
    }

    .size-btn {
      border: 0;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .size-readout {
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      color: rgba(255,255,255,0.3);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .value { color: var(--accent); }

    .slider {
      width: 100%;
      height: 4px;
      -webkit-appearance: none;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      outline: none;
    }
    
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    .next-ai-card {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 8px;
      align-items: center;
      padding: 4px;
      background: transparent;
    }

    .next-half, .ai-half {
      height: 100%;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: rgba(0,0,0,0.2);
    }

    .ai-toggle {
      width: 100%;
      height: 100%;
      font-size: 10px;
      letter-spacing: 0.5px;
      background: rgba(178, 164, 212, 0.15);
      color: var(--accent);
    }

    .ai-toggle.off {
      background: rgba(212, 164, 178, 0.1);
      color: var(--danger);
    }

    .next-piece {
      width: 40px;
      height: 24px;
      display: grid;
      grid-template-columns: repeat(4, 7px);
      grid-auto-rows: 7px;
      gap: 1px;
      justify-content: center;
      align-content: center;
    }

    .next-cell {
      width: 7px;
      height: 7px;
      border-radius: 2px;
      background: transparent;
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <section class="game-wrap">
      <canvas id="game"></canvas>
      <div class="overlay-chip" id="statusChip">AI ĐANG CHƠI</div>
    </section>

    <section class="controls-wrap">
      <div class="panel">
        <div class="title">ĐIỀU HƯỚNG</div>
        <div class="pad">
          <div class="dpad">
            <button id="btnUp" class="pad-btn up" type="button">▲</button>
            <button id="btnLeft" class="pad-btn left" type="button">◀</button>
            <button id="btnDown" class="pad-btn down" type="button">▼</button>
            <button id="btnRight" class="pad-btn right" type="button">▶</button>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="center-stack">
          <div class="mini-card">
            <div class="label-row"><span>RỦI RO</span><span id="riskValue" class="value">1.0x</span></div>
            <input id="riskRange" class="slider" type="range" min="0.2" max="2.2" step="0.1" value="1.0">
          </div>

          <div class="mini-card">
            <div class="label-row"><span>TỐC ĐỘ</span><span id="speedValue" class="value">Mức 4</span></div>
            <input id="speedRange" class="slider" type="range" min="1" max="10" step="1" value="4">
          </div>

          <div class="mini-card size-card">
            <div class="label-row"><span>CỠ BẢNG</span><span id="sizeValue" class="value">10x20</span></div>
            <div class="size-stepper">
              <button id="sizeMinusBtn" class="size-btn" type="button">-</button>
              <div id="sizeLabel" class="size-readout">CHUẨN</div>
              <button id="sizePlusBtn" class="size-btn" type="button">+</button>
            </div>
          </div>

          <div class="mini-card next-ai-card">
            <div class="next-half">
              <div id="nextPiece" class="next-piece"></div>
            </div>
            <div class="ai-half">
              <button id="aiToggleBtn" class="ai-toggle on" type="button">MÁY CHƠI</button>
            </div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="title">THAO TÁC</div>
        <div class="action-pad">
          <button id="btnA" class="action-btn" type="button">⟳</button>
          <button id="btnB" class="action-btn secondary" type="button">⟲</button>
          <button id="btnC" class="action-btn utility" type="button">BOM</button>
          <button id="btnD" class="action-btn beam" type="button">TIA</button>
        </div>
      </div>
    </section>

    <button id="controlToggleBtn" class="control-toggle" type="button" aria-label="Thu gọn" aria-expanded="true">👁</button>
    <div class="collapsed-actions" aria-label="Thao tác thu gọn">
      <button id="miniBombBtn" class="mini-action bomb" type="button" aria-label="Thả bom">✹</button>
      <button id="miniLaserBtn" class="mini-action laser" type="button" aria-label="Bắn tia quét">━</button>
    </div>
  </main>

<script>
// --- GIỮ NGUYÊN TOÀN BỘ LOGIC GỐC, CHỈ ĐỔI RENDER VÀ TEXT ---

const app = document.getElementById("app");
const canvas = document.getElementById("game");
const gameWrap = document.querySelector(".game-wrap");
const ctx = canvas.getContext("2d");

const VIEW_W = 340;
const VIEW_H = 680;
const DPR = Math.min(window.devicePixelRatio || 1, 2);

canvas.width = VIEW_W * DPR;
canvas.height = VIEW_H * DPR;
ctx.scale(DPR, DPR);

const btnLeft = document.getElementById("btnLeft");
const btnRight = document.getElementById("btnRight");
const btnDown = document.getElementById("btnDown");
const btnUp = document.getElementById("btnUp");
const btnA = document.getElementById("btnA");
const btnB = document.getElementById("btnB");
const btnC = document.getElementById("btnC");
const btnD = document.getElementById("btnD");
const miniBombBtn = document.getElementById("miniBombBtn");
const miniLaserBtn = document.getElementById("miniLaserBtn");

const speedRange = document.getElementById("speedRange");
const speedValue = document.getElementById("speedValue");
const riskRange = document.getElementById("riskRange");
const riskValue = document.getElementById("riskValue");
const sizeMinusBtn = document.getElementById("sizeMinusBtn");
const sizePlusBtn = document.getElementById("sizePlusBtn");
const sizeValue = document.getElementById("sizeValue");
const sizeLabel = document.getElementById("sizeLabel");
const nextPiece = document.getElementById("nextPiece");
const aiToggleBtn = document.getElementById("aiToggleBtn");
const statusChip = document.getElementById("statusChip");
const controlToggleBtn = document.getElementById("controlToggleBtn");

let speedFactor = Number(speedRange.value);
let riskFactor = Number(riskRange.value);
let aiEnabled = true;
let controlsCollapsed = false;
let paused = false;
let lastTapAt = 0;
let lastTapX = 0;
let lastTapY = 0;
let lastTapKind = "outside";

function syncCanvasDisplaySize() {
  const rect = gameWrap.getBoundingClientRect();
  if (!rect.width || !rect.height) return;

  const boardRatio = VIEW_W / VIEW_H;
  const displayH = Math.min(rect.height, rect.width / boardRatio);
  const displayW = displayH * boardRatio;

  canvas.style.width = `${Math.floor(displayW)}px`;
  canvas.style.height = `${Math.floor(displayH)}px`;
}

function updateViewportLayout() {
  const visualH = window.visualViewport ? window.visualViewport.height : 0;
  const h = Math.max(window.innerHeight || 0, visualH || 0);
  document.documentElement.style.setProperty("--app-h", `${Math.floor(h)}px`);
  requestAnimationFrame(syncCanvasDisplaySize);
}

updateViewportLayout();
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", updateViewportLayout);
  window.visualViewport.addEventListener("scroll", updateViewportLayout);
} else {
  window.addEventListener("resize", updateViewportLayout);
}
window.addEventListener("orientationchange", updateViewportLayout);

function setControlsCollapsed(collapsed) {
  controlsCollapsed = collapsed;
  app.classList.toggle("controls-collapsed", controlsCollapsed);
  controlToggleBtn.style.opacity = controlsCollapsed ? "0.4" : "1";
  requestAnimationFrame(syncCanvasDisplaySize);
}

// Bảng màu Lofi (Muted Pastel)
const SLEEP_COLORS = {
  I: "#7a95a5", O: "#a5997a", T: "#8d7aa5", S: "#7aa58b",
  Z: "#a57a84", J: "#7a87a5", L: "#a5887a"
};
function colorOf(type) { return SLEEP_COLORS[type]; }

controlToggleBtn.addEventListener("click", () => { setControlsCollapsed(!controlsCollapsed); });

speedRange.addEventListener("input", () => {
  speedFactor = Number(speedRange.value);
  speedValue.textContent = "Mức " + speedFactor;
});

riskRange.addEventListener("input", () => {
  riskFactor = Number(riskRange.value);
  riskValue.textContent = riskFactor.toFixed(1) + "x";
});

sizeMinusBtn.addEventListener("click", () => { setGridSize(sizePresetIndex - 1); });
sizePlusBtn.addEventListener("click", () => { setGridSize(sizePresetIndex + 1); });

aiToggleBtn.addEventListener("click", () => {
  aiEnabled = !aiEnabled;
  aiToggleBtn.textContent = aiEnabled ? "MÁY CHƠI" : "TỰ CHƠI";
  aiToggleBtn.classList.toggle("off", !aiEnabled);
  aiToggleBtn.classList.toggle("on", aiEnabled);
  manualOverrideMs = aiEnabled ? 0 : 999999;
  drama.controlText = aiEnabled ? "Máy tiếp quản" : "Đang điều khiển";
});

function togglePause() {
  paused = !paused;
  drama.controlText = paused ? "Tạm dừng" : (aiEnabled ? "Đã tiếp tục" : "Đang điều khiển");
  addMessage(paused ? "TẠM DỪNG" : "TIẾP TỤC", paused ? "#d4a4b2" : "#b2a4d4");
}

function bindHoldButton(button, action, repeatMs = 95, repeat = true) {
  let timer = null;
  const stop = () => { if (timer) { clearInterval(timer); timer = null; } };
  button.addEventListener("pointerdown", (event) => {
    event.preventDefault(); action();
    if (repeat) { stop(); timer = setInterval(action, repeatMs); }
  });
  button.addEventListener("pointerup", stop);
  button.addEventListener("pointercancel", stop);
  button.addEventListener("pointerleave", stop);
}

const SIZE_PRESETS = [
  { level: -2, label: "SIÊU NHỎ", cols: 16 },
  { level: -1, label: "NHỎ", cols: 13 },
  { level: 0, label: "CHUẨN", cols: 10 },
  { level: 1, label: "LỚN", cols: 8 },
  { level: 2, label: "RẤT LỚN", cols: 7 }
];

let sizePresetIndex = 2;
let W = 10;
let H = 20;
let CELL = 34;
const OX = 0;
const OY = 0;

function applyGridSize(index) {
  sizePresetIndex = Math.max(0, Math.min(SIZE_PRESETS.length - 1, index));
  const preset = SIZE_PRESETS[sizePresetIndex];
  W = preset.cols;
  H = preset.cols * 2;
  CELL = VIEW_W / W;
}

function updateSizeUI() {
  const preset = SIZE_PRESETS[sizePresetIndex];
  sizeValue.textContent = `${W}x${H}`;
  sizeLabel.textContent = preset.label;
  sizeMinusBtn.disabled = sizePresetIndex === 0;
  sizePlusBtn.disabled = sizePresetIndex === SIZE_PRESETS.length - 1;
}

function setGridSize(index) {
  if (index === sizePresetIndex) return;
  applyGridSize(index);
  updateSizeUI();
  resetGame();
}

applyGridSize(sizePresetIndex);

const SHAPES = {
  I: [[1, 1, 1, 1]],
  O: [[1, 1], [1, 1]],
  T: [[0, 1, 0], [1, 1, 1]],
  S: [[0, 1, 1], [1, 1, 0]],
  Z: [[1, 1, 0], [0, 1, 1]],
  J: [[1, 0, 0], [1, 1, 1]],
  L: [[0, 0, 1], [1, 1, 1]]
};

const PHASES = {
  CALM: "TĨNH LẶNG",
  SETUP: "DÀN TRẬN",
  TENSION: "CĂNG THẲNG",
  CRISIS: "NGUY HIỂM",
  RECOVERY: "KHÔI PHỤC",
  PAYOFF: "CHỜ THU HOẠCH"
};

let board;
let bag = [];
let nextQueue = [];
let current = null;
let target = null;

let score = 0;
let totalLines = 0;
let combo = 0;
let pieceIndex = 0;

let particles = [];
let flashes = [];
let messages = [];

let lastTime = 0;
let dropCounter = 0;
let botCounter = 0;
let slowmo = 0;
let shake = 0;

const PREVIEW_COUNT = 5;

let drama = {
  phase: PHASES.CALM,
  risk: 0,
  planText: "Dọn dẹp",
  controlText: "Ổn định",
  lastBigEvent: "Mở màn"
};

let recoveryMode = 0;

let execution = {
  activeError: null,
  offsetDir: 0,
  delayFrames: 0,
  lastErrorPiece: -999,
  nextErrorAt: 9 + Math.floor(Math.random() * 8),
  minGap: 9
};

let manualOverrideMs = 0;
const SPECIAL_COOLDOWN_MS = 30000;
let bombCooldownMs = 0;
let laserCooldownMs = 0;
let autoSaveCooldownMs = 0;
let fallingBomb = null;

let dragState = {
  active: false,
  kind: null,
  pointerId: null,
  type: null,
  fromX: 0,
  fromY: 0,
  grabX: 0,
  grabY: 0,
  startX: 0,
  startY: 0,
  px: 0,
  py: 0,
  moved: false
};

function createBoard() { return Array.from({ length: H }, () => Array(W).fill(null)); }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function nextType() {
  if (bag.length === 0) bag = shuffle(Object.keys(SHAPES));
  return bag.pop();
}
function fillQueue() {
  while (nextQueue.length < PREVIEW_COUNT) nextQueue.push(nextType());
}

function rotateCW(matrix) { return matrix[0].map((_, i) => matrix.map(row => row[i]).reverse()); }
function matrixKey(matrix) { return matrix.map(row => row.join("")).join("/"); }
function getRotations(shape) {
  const result = [];
  const seen = new Set();
  let m = shape;
  for (let i = 0; i < 4; i++) {
    const key = matrixKey(m);
    if (!seen.has(key)) { seen.add(key); result.push(m); }
    m = rotateCW(m);
  }
  return result;
}

const ROTATIONS = {};
for (const type in SHAPES) { ROTATIONS[type] = getRotations(SHAPES[type]); }

function cloneBoard(b) { return b.map(row => row.map(cell => cell ? { ...cell } : null)); }

function collisionOn(b, shape, px, py) {
  for (let y = 0; y < shape.length; y++) {
    for (let x = 0; x < shape[y].length; x++) {
      if (!shape[y][x]) continue;
      const nx = px + x;
      const ny = py + y;
      if (nx < 0 || nx >= W || ny >= H) return true;
      if (ny >= 0 && b[ny][nx]) return true;
    }
  }
  return false;
}
function collision(shape, px, py) { return collisionOn(board, shape, px, py); }

function placeAndClear(b, shape, px, py, type) {
  for (let y = 0; y < shape.length; y++) {
    for (let x = 0; x < shape[y].length; x++) {
      if (!shape[y][x]) continue;
      const nx = px + x;
      const ny = py + y;
      if (ny >= 0 && ny < H && nx >= 0 && nx < W) {
        b[ny][nx] = { type };
      }
    }
  }
  let cleared = 0;
  for (let y = H - 1; y >= 0; y--) {
    if (b[y].every(Boolean)) {
      b.splice(y, 1);
      b.unshift(Array(W).fill(null));
      cleared++;
      y++;
    }
  }
  return cleared;
}

function getColumnHeights(b) {
  const heights = Array(W).fill(0);
  for (let x = 0; x < W; x++) {
    for (let y = 0; y < H; y++) {
      if (b[y][x]) { heights[x] = H - y; break; }
    }
  }
  return heights;
}
function getMaxHeight(b) { return Math.max(...getColumnHeights(b)); }

function countHoles(b) {
  let holes = 0;
  for (let x = 0; x < W; x++) {
    let seenBlock = false;
    for (let y = 0; y < H; y++) {
      if (b[y][x]) seenBlock = true;
      else if (seenBlock) holes++;
    }
  }
  return holes;
}

function countWells(b) {
  let wells = 0;
  for (let x = 0; x < W; x++) {
    for (let y = 0; y < H; y++) {
      if (b[y][x]) continue;
      const leftWall = x === 0 || b[y][x - 1];
      const rightWall = x === W - 1 || b[y][x + 1];
      if (leftWall && rightWall) wells++;
    }
  }
  return wells;
}

function getDangerLevel(b) {
  const maxHeight = getMaxHeight(b);
  const holes = countHoles(b);
  let danger = 0;
  danger += maxHeight / Math.max(8, H * 0.86);
  danger += Math.min(holes / Math.max(8, W * 1.2), 1) * 0.4;
  return Math.min(1, danger);
}

function hasTetrisWell(b) {
  const heights = getColumnHeights(b);
  for (let x = 0; x < W; x++) {
    const left = x === 0 ? H : heights[x - 1];
    const right = x === W - 1 ? H : heights[x + 1];
    if (left >= 4 && right >= 4 && heights[x] <= Math.max(left, right) - 3) return true;
  }
  return false;
}

function evaluateBoard(b, cleared) {
  const heights = getColumnHeights(b);
  const aggregateHeight = heights.reduce((a, n) => a + n, 0);
  const maxHeight = Math.max(...heights);

  let bumpiness = 0;
  for (let i = 0; i < W - 1; i++) bumpiness += Math.abs(heights[i] - heights[i + 1]);

  const holes = countHoles(b);
  const wells = countWells(b);

  let lineReward = 1100;
  let tetrisReward = 2800;
  let holePenalty = 900;
  let heightPenalty = 26;
  let bumpPenalty = 52;
  let wellReward = 18;

  if (drama.phase === PHASES.SETUP) { wellReward = 90; lineReward = 850; }
  if (drama.phase === PHASES.TENSION) { heightPenalty = 16; wellReward = 110; lineReward = 750; }
  if (drama.phase === PHASES.CRISIS) { holePenalty = 1350; heightPenalty = 80; lineReward = 1450; tetrisReward = 3200; }
  if (recoveryMode > 0) { holePenalty += 450; heightPenalty += 35; lineReward += 550; bumpPenalty += 20; }

  let value = 0;
  value += cleared * lineReward;
  value += cleared === 4 ? tetrisReward : 0;
  value -= holes * holePenalty;
  value -= aggregateHeight * heightPenalty;
  value -= bumpiness * bumpPenalty;
  value -= maxHeight * 38;
  value += wells * wellReward;

  return value;
}

function getAllMoves(b, type) {
  const rotations = ROTATIONS[type];
  const moves = [];

  for (let r = 0; r < rotations.length; r++) {
    const shape = rotations[r];
    for (let x = -shape[0].length; x <= W; x++) {
      let y = -4;
      while (!collisionOn(b, shape, x, y + 1)) y++;
      if (collisionOn(b, shape, x, y)) continue;

      const sim = cloneBoard(b);
      const cleared = placeAndClear(sim, shape, x, y, type);
      const score = evaluateBoard(sim, cleared);
      moves.push({ x, y, rot: r, cleared, score });
    }
  }
  return moves;
}

function rankMovesWithLookahead(b, type, queue) {
  const currentMoves = getAllMoves(b, type);
  const next = queue[0];

  for (const move of currentMoves) {
    const sim = cloneBoard(b);
    const shape = ROTATIONS[type][move.rot];
    const cleared = placeAndClear(sim, shape, move.x, move.y, type);
    let score = evaluateBoard(sim, cleared);

    if (next) {
      const nextMoves = getAllMoves(sim, next);
      if (nextMoves.length > 0) {
        let bestNext = -Infinity;
        for (const n of nextMoves) {
          const sim2 = cloneBoard(sim);
          const nextShape = ROTATIONS[next][n.rot];
          const cleared2 = placeAndClear(sim2, nextShape, n.x, n.y, next);
          bestNext = Math.max(bestNext, evaluateBoard(sim2, cleared2));
        }
        score += bestNext * 0.42;
      }
    }
    move.score = score;
  }
  return currentMoves.sort((a, b) => b.score - a.score);
}

function chooseMove(b, type, queue = []) {
  const ranked = rankMovesWithLookahead(b, type, queue);
  return ranked[0] || { x: Math.floor(W / 2), y: 0, rot: 0, cleared: 0, score: 0 };
}

function maybeCreateExecutionError(type) {
  execution.activeError = null;
  if (!aiEnabled) return;
  execution.offsetDir = 0;
  execution.delayFrames = 0;

  const danger = getDangerLevel(board);
  if (danger > 0.38) return;
  if (pieceIndex < execution.nextErrorAt) return;
  if (pieceIndex - execution.lastErrorPiece < execution.minGap) return;

  execution.lastErrorPiece = pieceIndex;
  execution.nextErrorAt = pieceIndex + 18 + Math.floor(Math.random() * 18);

  const triggerChance = Math.max(0, riskFactor - 1) * 0.06;
  if (Math.random() > Math.min(triggerChance, 0.08)) return;

  const possible = ["INPUT_DELAY"];
  const picked = possible[Math.floor(Math.random() * possible.length)];

  if (picked === "OFFSET_LEFT") { execution.activeError = "OFFSET"; execution.offsetDir = -1; }
  else if (picked === "OFFSET_RIGHT") { execution.activeError = "OFFSET"; execution.offsetDir = 1; }
  else if (picked === "OVER_ROTATE") execution.activeError = "OVER_ROTATE";
  else if (picked === "INPUT_DELAY") { execution.activeError = "INPUT_DELAY"; execution.delayFrames = 8 + Math.floor(Math.random() * 12); }
  else execution.activeError = "EARLY_DROP";

  drama.controlText = "Có vẻ bấm nhầm";
}

function setManualOverride(label) {
  manualOverrideMs = 850;
  drama.controlText = label;
  drama.lastBigEvent = "Bạn can thiệp";
}

function userNudge(dx) {
  if (!current) return;
  if (!collision(current.shape, current.x + dx, current.y)) {
    current.x += dx;
    setManualOverride(dx < 0 ? "Bạn đẩy trái" : "Bạn đẩy phải");
  }
}

function userSoftDrop() {
  if (!current) return;
  setManualOverride("Bạn thả xuống");
  softDrop();
}

function userHardDrop() {
  if (!current) return;
  setManualOverride("Bạn thả nhanh");
  while (!collision(current.shape, current.x, current.y + 1)) current.y++;
  const ok = lockPiece();
  if (ok) spawnPiece();
  else resetGame();
}

function userRotate(dir) {
  if (!current) return;
  const rotations = ROTATIONS[current.type];
  const nextRot = (current.rot + dir + rotations.length) % rotations.length;
  const nextShape = rotations[nextRot];
  const kicks = [0, -1, 1, -2, 2];

  for (const k of kicks) {
    if (!collision(nextShape, current.x + k, current.y)) {
      current.rot = nextRot;
      current.shape = nextShape;
      current.x += k;
      setManualOverride(dir > 0 ? "Bạn xoay xuôi" : "Bạn xoay ngược");
      return;
    }
  }
}

function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }

function getShapeBounds(shape) {
  return { width: Math.max(...shape.map(row => row.length)), height: shape.length };
}

function burstCell(x, y, color, count = 8) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x: OX + x * CELL + CELL / 2,
      y: OY + y * CELL + CELL / 2,
      vx: (Math.random() - 0.5) * 2.5,
      vy: (Math.random() - 0.5) * 2 - 1, // Bay lên chầm chậm (Lofi)
      life: 1500,
      max: 1500,
      size: Math.random() * 2.5 + 1.5,
      color
    });
  }
}

function clearBottomRows(count, label = "TIA QUÉT", color = "#b2a4d4") {
  const rows = Math.min(count, H);
  const start = H - rows;
  let removed = 0;

  for (let y = start; y < H; y++) {
    flashes.push({ y, life: 600, max: 600 });
    for (let x = 0; x < W; x++) {
      const cell = board[y][x];
      if (!cell) continue;
      removed++;
      burstCell(x, y, colorOf(cell.type), 4);
    }
  }

  board.splice(start, rows);
  while (board.length < H) board.unshift(Array(W).fill(null));

  slowmo = Math.max(slowmo, 260);
  shake = Math.max(shake, 7);
  score += removed * 35 + rows * 220;
  recoveryMode = Math.max(recoveryMode, 0.75);
  addMessage(label, color);
  return removed;
}

function findDensestBombCenter(radius) {
  let best = null;
  let bestScore = -Infinity;
  for (let cy = 0; cy < H; cy++) {
    for (let cx = 0; cx < W; cx++) {
      let localScore = 0;
      for (let y = Math.max(0, cy - radius); y <= Math.min(H - 1, cy + radius); y++) {
        for (let x = Math.max(0, cx - radius); x <= Math.min(W - 1, cx + radius); x++) {
          const cell = board[y][x];
          if (!cell) continue;
          const d = Math.hypot(x - cx, y - cy);
          if (d <= radius + 0.35) localScore += 10 - d * 2 + y / H;
        }
      }
      if (localScore > bestScore) { bestScore = localScore; best = { x: cx, y: cy }; }
    }
  }
  return bestScore > 0 ? best : null;
}

function findMostDangerousBombCenter(radius) {
  let best = null;
  let bestScore = -Infinity;
  const heights = getColumnHeights(board);

  for (let cy = 0; cy < H; cy++) {
    for (let cx = 0; cx < W; cx++) {
      let localScore = 0;
      for (let y = Math.max(0, cy - radius); y <= Math.min(H - 1, cy + radius); y++) {
        for (let x = Math.max(0, cx - radius); x <= Math.min(W - 1, cx + radius); x++) {
          const d = Math.hypot(x - cx, y - cy);
          if (d > radius + 0.35) continue;

          const cell = board[y][x];
          if (cell) {
            const heightPressure = (H - y) / H;
            const columnPressure = heights[x] / H;
            localScore += 8 + heightPressure * 12 + columnPressure * 10 - d * 2;
          } else {
            let hasBlockAbove = false;
            for (let yy = 0; yy < y; yy++) {
              if (board[yy][x]) { hasBlockAbove = true; break; }
            }
            if (hasBlockAbove) localScore += 4;
          }
        }
      }
      if (localScore > bestScore) { bestScore = localScore; best = { x: cx, y: cy }; }
    }
  }
  return bestScore > 0 ? best : null;
}

function getBombCenter(radius) {
  const dangerTarget = findMostDangerousBombCenter(radius);
  if (dangerTarget) return dangerTarget;

  if (current) {
    const bounds = getShapeBounds(current.shape);
    const ghostY = getGhostY(current.shape, current.x);
    return {
      x: clamp(Math.round(current.x + bounds.width / 2 - 0.5), 0, W - 1),
      y: clamp(Math.round(ghostY + bounds.height / 2 - 0.5), 0, H - 1)
    };
  }
  return findDensestBombCenter(radius) || { x: Math.floor(W / 2), y: H - 3 };
}

function collectBombCells(cx, cy, radius) {
  const cells = [];
  for (let y = Math.max(0, cy - radius); y <= Math.min(H - 1, cy + radius); y++) {
    for (let x = Math.max(0, cx - radius); x <= Math.min(W - 1, cx + radius); x++) {
      if (!board[y][x]) continue;
      const d = Math.hypot(x - cx, y - cy);
      if (d <= radius + 0.35) cells.push({ x, y, d });
    }
  }
  cells.sort((a, b) => a.d - b.d);
  return cells.slice(0, Math.max(8, Math.floor(W * H * 0.08)));
}

function dropBomb() {
  if (bombCooldownMs > 0) return;
  if (fallingBomb) return;

  const radius = clamp(Math.round(W / 5), 2, 3);
  const center = getBombCenter(radius);
  fallingBomb = {
    x: Math.floor(W / 2),
    y: -1.25,
    targetX: center.x,
    targetY: center.y,
    radius
  };

  bombCooldownMs = SPECIAL_COOLDOWN_MS;
  drama.controlText = "Đã gọi Bom";
  addMessage("THẢ BOM", "#d4a4b2");
}

function explodeFallingBomb() {
  if (!fallingBomb) return;
  const cx = clamp(Math.round(fallingBomb.x), 0, W - 1);
  const cy = clamp(Math.round(fallingBomb.y), 0, H - 1);
  let cells = collectBombCells(cx, cy, fallingBomb.radius);

  if (cells.length === 0) {
    const fallback = findDensestBombCenter(fallingBomb.radius);
    if (fallback) cells = collectBombCells(fallback.x, fallback.y, fallingBomb.radius);
  }

  for (const cell of cells) {
    const old = board[cell.y][cell.x];
    if (!old) continue;
    burstCell(cell.x, cell.y, colorOf(old.type), 6);
    board[cell.y][cell.x] = null;
  }

  burstCell(cx, cy, "#d4a4b2", 12);
  slowmo = Math.max(slowmo, 280);
  shake = Math.max(shake, 9);
  recoveryMode = Math.max(recoveryMode, 0.55);
  score += cells.length * 70;
  addMessage("BÙM~", "#d4a4b2");
  fallingBomb = null;
}

function updateFallingBomb(rawDt) {
  if (!fallingBomb) return;
  const xDelta = fallingBomb.targetX - fallingBomb.x;
  const xStep = rawDt * 0.011;
  if (Math.abs(xDelta) <= xStep) fallingBomb.x = fallingBomb.targetX;
  else fallingBomb.x += Math.sign(xDelta) * xStep;

  fallingBomb.y += rawDt * (0.007 + speedFactor * 0.0007);
  if (fallingBomb.y >= fallingBomb.targetY) explodeFallingBomb();
}

function fireLaser() {
  if (laserCooldownMs > 0) return;
  laserCooldownMs = SPECIAL_COOLDOWN_MS;
  clearBottomRows(5, "TIA QUÉT", "#d4c8a4");
}

function triggerAutoSave() {
  if (autoSaveCooldownMs > 0) return false;
  autoSaveCooldownMs = 8000;
  clearBottomRows(Math.min(5, Math.max(3, Math.floor(H * 0.22))), "TỰ DỌN", "#a4d4b8");
  return true;
}

bindHoldButton(btnLeft, () => userNudge(-1), 90, true);
bindHoldButton(btnRight, () => userNudge(1), 90, true);
bindHoldButton(btnDown, () => userSoftDrop(), 55, true);
bindHoldButton(btnUp, () => userHardDrop(), 120, false);
bindHoldButton(btnA, () => userRotate(1), 115, true);
bindHoldButton(btnB, () => userRotate(-1), 115, true);
bindHoldButton(btnC, () => dropBomb(), 120, false);
bindHoldButton(btnD, () => fireLaser(), 120, false);
bindHoldButton(miniBombBtn, () => dropBomb(), 120, false);
bindHoldButton(miniLaserBtn, () => fireLaser(), 120, false);

function spawnPiece() {
  fillQueue();
  const type = nextQueue.shift();
  fillQueue();
  const shape = ROTATIONS[type][0];

  current = {
    type, rot: 0, shape,
    x: Math.floor((W - shape[0].length) / 2),
    y: -shape.length
  };

  pieceIndex++;
  target = chooseMove(board, type, nextQueue);
  maybeCreateExecutionError(type);

  if (collision(current.shape, current.x, current.y)) {
    triggerAutoSave();
    if (collision(current.shape, current.x, current.y)) {
      board = createBoard();
      addMessage("TỰ CỨU", "#a4d4b8");
    }
  }
}

function getExecutionTargetX() {
  if (!target) return current ? current.x : 0;
  if (execution.activeError === "OFFSET") return target.x + execution.offsetDir;
  return target.x;
}

function getExecutionTargetRot() {
  if (!target || !current) return 0;
  const rotations = ROTATIONS[current.type];
  if (execution.activeError === "OVER_ROTATE") return (target.rot + 1) % rotations.length;
  return target.rot;
}

function executionTargetReached() {
  if (!current || !target) return false;
  return current.x === getExecutionTargetX() && current.rot === getExecutionTargetRot();
}

function botStep() {
  if (!current || !target) return;
  if (!aiEnabled) return;
  if (manualOverrideMs > 0) return;

  if (execution.activeError === "INPUT_DELAY" && execution.delayFrames > 0) {
    execution.delayFrames--;
    return;
  }

  const rotations = ROTATIONS[current.type];
  const desiredRot = getExecutionTargetRot();

  if (current.rot !== desiredRot) {
    const nextRot = (current.rot + 1) % rotations.length;
    const nextShape = rotations[nextRot];
    const kicks = [0, -1, 1, -2, 2];
    for (const k of kicks) {
      if (!collision(nextShape, current.x + k, current.y)) {
        current.rot = nextRot; current.shape = nextShape; current.x += k;
        return;
      }
    }
  }

  const desiredX = getExecutionTargetX();
  if (current.x !== desiredX) {
    const dir = current.x < desiredX ? 1 : -1;
    if (!collision(current.shape, current.x + dir, current.y)) current.x += dir;
  }
}

function softDrop() {
  if (!current) return;
  current.y++;
  if (collision(current.shape, current.x, current.y)) {
    current.y--;
    const ok = lockPiece();
    if (ok) spawnPiece();
    else resetGame();
  }
}

function lockPiece() {
  let overflow = false;
  const hadExecutionError = Boolean(execution.activeError);

  for (let y = 0; y < current.shape.length; y++) {
    for (let x = 0; x < current.shape[y].length; x++) {
      if (!current.shape[y][x]) continue;
      const nx = current.x + x;
      const ny = current.y + y;
      if (ny < 0) overflow = true;
      else if (ny >= 0 && ny < H && nx >= 0 && nx < W) board[ny][nx] = { type: current.type };
    }
  }

  if (overflow) {
    triggerAutoSave();
    execution.activeError = null;
    return true;
  }

  if (hadExecutionError) {
    triggerMistakeReaction();
    execution.activeError = null;
  }

  const lines = clearLines();
  if (lines > 0) {
    combo++;
    totalLines += lines;
    score += lines * lines * 140 + combo * 60;

    if (lines === 4) {
      score += 1000;
      slowmo = 520;
      shake = 10;
      addMessage("TETRIS~", "#b2a4d4");
      drama.lastBigEvent = "Ăn Tetris";
      recoveryMode = Math.max(0, recoveryMode - 0.8);
    } else {
      slowmo = 220;
      shake = Math.max(shake, 3);
      addMessage(`XÓA ${lines}`, "#d4d2dc");
      recoveryMode = Math.max(0, recoveryMode - 0.25);
    }
  } else {
    combo = 0;
    score += 8;
  }
  return true;
}

function triggerMistakeReaction() {
  recoveryMode = 1;
  shake = 8;
  slowmo = 180;
  drama.controlText = "Nhầm lẫn thao tác";
  drama.lastBigEvent = "Lỗi nhập";
  addMessage("LỖI NHỊP", "#d4a4b2");
}

function clearLines() {
  let lines = 0;
  for (let y = H - 1; y >= 0; y--) {
    if (board[y].every(Boolean)) {
      makeLineParticles(y);
      flashes.push({ y, life: 600, max: 600 });
      board.splice(y, 1);
      board.unshift(Array(W).fill(null));
      lines++;
      y++;
    }
  }
  return lines;
}

function makeLineParticles(row) {
  for (let x = 0; x < W; x++) {
    const cell = board[row][x];
    const color = cell ? colorOf(cell.type) : "#ffffff";
    for (let i = 0; i < 5; i++) {
      particles.push({
        x: OX + x * CELL + CELL / 2,
        y: OY + row * CELL + CELL / 2,
        vx: (Math.random() - 0.5) * 2.5,
        vy: (Math.random() - 0.5) * 2.5 - 0.5,
        life: 2000,
        max: 2000,
        size: Math.random() * 2.5 + 1.5,
        color
      });
    }
  }
}

function addMessage(text, color) {
  messages.push({
    text, color,
    x: OX + W * CELL / 2,
    y: OY + H * CELL / 2,
    life: 1500,
    max: 1500
  });
}

function updateEffects(dt) {
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy -= 0.01; // Lực đẩy nhẹ lên trên (như bọt khí)
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);

  for (const f of flashes) f.life -= dt;
  flashes = flashes.filter(f => f.life > 0);

  for (const m of messages) { m.y -= 0.02 * dt; m.life -= dt; }
  messages = messages.filter(m => m.life > 0);

  if (shake > 0) { shake -= dt * 0.035; if (shake < 0) shake = 0; }
}

function updateDirector(rawDt) {
  const risk = getDangerLevel(board);
  const holes = countHoles(board);
  const maxHeight = getMaxHeight(board);
  const well = hasTetrisWell(board);
  const iSoon = nextQueue.includes("I");

  drama.risk = risk;

  if (recoveryMode > 0.12) {
    drama.phase = PHASES.RECOVERY;
    drama.planText = "Đang gỡ rối";
    drama.controlText = execution.activeError ? "Lỗi thao tác" : "Dọn bớt";
  } else if (risk > 0.74 || maxHeight >= H * 0.75) {
    drama.phase = PHASES.CRISIS;
    drama.planText = "Sinh tồn";
    drama.controlText = "Cẩn trọng";
  } else if (current && current.type === "I" && well) {
    drama.phase = PHASES.PAYOFF;
    drama.planText = "Chờ Tetris";
    drama.controlText = "Chốt hạ";
  } else if (risk > 0.48 || holes > Math.max(1, W * 0.16)) {
    drama.phase = PHASES.TENSION;
    drama.planText = iSoon ? "Chờ khối I" : "Giữ nhịp";
    drama.controlText = execution.activeError ? "Lỗi thao tác" : "Ổn định";
  } else if (well || iSoon) {
    drama.phase = PHASES.SETUP;
    drama.planText = iSoon ? "Tạo rãnh" : "Dọn rác";
    drama.controlText = execution.activeError ? "Lỗi thao tác" : "Ổn định";
  } else {
    drama.phase = PHASES.CALM;
    drama.planText = "Dọn dẹp";
    drama.controlText = execution.activeError ? "Lỗi thao tác" : "Ổn định";
  }

  if (execution.activeError === "OFFSET") drama.controlText = "Lệch tay";
  if (execution.activeError === "OVER_ROTATE") drama.controlText = "Xoay lố";
  if (execution.activeError === "INPUT_DELAY") drama.controlText = "Chậm nhịp";
  if (execution.activeError === "EARLY_DROP") drama.controlText = "Rơi sớm";

  if (manualOverrideMs > 0) drama.controlText = "Bạn đang chơi";

  if (recoveryMode > 0) { recoveryMode -= rawDt / 7200; if (recoveryMode < 0) recoveryMode = 0; }
}

function updateAbilityButton(button, label, cooldownMs) {
  if (cooldownMs > 0) {
    button.textContent = `${label}${Math.ceil(cooldownMs / 1000)}`;
    button.disabled = true;
  } else {
    button.textContent = label;
    button.disabled = false;
  }
}

function updateCompactUI() {
  const nextType = nextQueue[0] || "I";
  nextPiece.innerHTML = "";
  const shape = ROTATIONS[nextType][0];
  for (let y = 0; y < 2; y++) {
    for (let x = 0; x < 4; x++) {
      const cell = document.createElement("div");
      cell.className = "next-cell";
      if (shape[y] && shape[y][x]) cell.style.background = colorOf(nextType);
      nextPiece.appendChild(cell);
    }
  }

  updateAbilityButton(btnC, "BOM", bombCooldownMs);
  updateAbilityButton(btnD, "TIA", laserCooldownMs);
  updateAbilityButton(miniBombBtn, "✹", bombCooldownMs);
  updateAbilityButton(miniLaserBtn, "━", laserCooldownMs);
  updateSizeUI();

  if (paused) statusChip.textContent = "TẠM DỪNG";
  else if (!aiEnabled) statusChip.textContent = "BẠN ĐANG CHƠI";
  else statusChip.textContent = `${drama.phase} - ${drama.controlText}`;
}

function canvasPointFromEvent(event) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (event.clientX - rect.left) * (VIEW_W / rect.width),
    y: (event.clientY - rect.top) * (VIEW_H / rect.height)
  };
}

function gridFromCanvasPoint(point) {
  return { x: Math.floor((point.x - OX) / CELL), y: Math.floor((point.y - OY) / CELL) };
}

function isInsideBoardCell(x, y) { return x >= 0 && x < W && y >= 0 && y < H; }
function isCurrentPieceCell(cell) {
  if (!current) return false;
  const localX = cell.x - current.x;
  const localY = cell.y - current.y;
  return Boolean(current.shape[localY] && current.shape[localY][localX]);
}

function getCanvasTarget(point) {
  const cell = gridFromCanvasPoint(point);
  if (isInsideBoardCell(cell.x, cell.y) && isCurrentPieceCell(cell))
    return { kind: "current", cell, grabX: cell.x - current.x, grabY: cell.y - current.y };
  if (isInsideBoardCell(cell.x, cell.y) && board[cell.y][cell.x])
    return { kind: "locked", cell };
  return { kind: "outside", cell };
}

function captureCanvasPointer(event) {
  dragState.pointerId = event.pointerId;
  if (canvas.setPointerCapture) try { canvas.setPointerCapture(event.pointerId); } catch (_) {}
}
function releaseCanvasPointer() {
  if (dragState.pointerId !== null && canvas.releasePointerCapture)
    try { canvas.releasePointerCapture(dragState.pointerId); } catch (_) {}
}

function resetDragState() {
  releaseCanvasPointer();
  dragState.active = false;
  dragState.kind = null;
  dragState.pointerId = null;
  dragState.type = null;
  dragState.grabX = 0;
  dragState.grabY = 0;
  dragState.moved = false;
}

function moveCurrentPieceTo(x, y) {
  if (!current) return false;
  const safeY = Math.max(1 - current.shape.length, y);
  if (collision(current.shape, x, safeY)) return false;
  current.x = x; current.y = safeY; target = null;
  setManualOverride("Đang kéo gạch");
  return true;
}

function finishLockedBlockDrag(point) {
  const cell = gridFromCanvasPoint(point);
  const inside = isInsideBoardCell(cell.x, cell.y);

  if (inside && !board[cell.y][cell.x]) {
    board[cell.y][cell.x] = { type: dragState.type };
    addMessage("ĐÃ CHUYỂN", "#b2a4d4");
  } else if (!inside) {
    addMessage("ĐÃ XÓA", "#d4a4b2");
  } else {
    board[dragState.fromY][dragState.fromX] = { type: dragState.type };
    addMessage("BỊ CHẶN", "#d4a4b2");
  }

  setManualOverride("Can thiệp bảng");
  const lines = clearLines();
  if (lines > 0) {
    totalLines += lines;
    score += lines * lines * 90;
    slowmo = 180;
    shake = 4;
  }
}

function onCanvasPointerDown(event) {
  const point = canvasPointFromEvent(event);
  const targetInfo = getCanvasTarget(point);
  const now = performance.now();
  const tapKind = targetInfo.kind === "outside" ? "outside" : "brick";
  const isDoubleTap = (now - lastTapAt < 320 && tapKind === lastTapKind && Math.hypot(point.x - lastTapX, point.y - lastTapY) < 55);

  event.preventDefault();

  if (isDoubleTap && tapKind === "brick") {
    lastTapAt = 0; userRotate(1); return;
  }

  lastTapAt = now; lastTapX = point.x; lastTapY = point.y; lastTapKind = tapKind;

  dragState.active = true;
  dragState.kind = targetInfo.kind;
  dragState.startX = point.x; dragState.startY = point.y;
  dragState.px = point.x; dragState.py = point.y;
  dragState.moved = false;
  captureCanvasPointer(event);

  if (targetInfo.kind === "current") {
    dragState.grabX = targetInfo.grabX; dragState.grabY = targetInfo.grabY;
    setManualOverride("Đang kéo gạch");
    return;
  }
  if (targetInfo.kind === "locked") {
    dragState.type = board[targetInfo.cell.y][targetInfo.cell.x].type;
    dragState.fromX = targetInfo.cell.x; dragState.fromY = targetInfo.cell.y;
    board[targetInfo.cell.y][targetInfo.cell.x] = null;
    setManualOverride("Nhặt gạch cũ");
  }
}

function onCanvasPointerMove(event) {
  if (!dragState.active) return;
  const point = canvasPointFromEvent(event);
  dragState.px = point.x; dragState.py = point.y;
  if (Math.hypot(point.x - dragState.startX, point.y - dragState.startY) > 10) dragState.moved = true;
  if (dragState.kind !== "current") return;

  const cell = gridFromCanvasPoint(point);
  const targetX = cell.x - dragState.grabX;
  const targetY = cell.y - dragState.grabY;
  if (moveCurrentPieceTo(targetX, targetY)) dragState.moved = true;
}

function onCanvasPointerUp(event) {
  if (!dragState.active) return;
  const point = canvasPointFromEvent(event);
  const kind = dragState.kind;
  const wasTap = Math.hypot(point.x - dragState.startX, point.y - dragState.startY) < 10;

  if (kind === "outside" && wasTap) togglePause();
  else if (kind === "locked") finishLockedBlockDrag(point);
  else if (kind === "current") setManualOverride("Đã thả gạch");

  resetDragState();
}

canvas.addEventListener("pointerdown", onCanvasPointerDown);
canvas.addEventListener("pointermove", onCanvasPointerMove);
canvas.addEventListener("pointerup", onCanvasPointerUp);
canvas.addEventListener("pointercancel", onCanvasPointerUp);

function getGhostY(shape, x) {
  let y = current ? current.y : -4;
  while (!collisionOn(board, shape, x, y + 1)) y++;
  return y;
}

function drawBlock(gx, gy, color, alpha = 1, scale = 1) {
  if (gy < 0) return;
  const pad = 2;
  const size = (CELL - pad * 2) * scale;
  const cx = OX + gx * CELL + CELL / 2;
  const cy = OY + gy * CELL + CELL / 2;

  ctx.save();
  ctx.globalAlpha = alpha;
  
  ctx.beginPath();
  ctx.roundRect(cx - size / 2, cy - size / 2, size, size, 6);
  ctx.fillStyle = color;
  ctx.fill();

  ctx.beginPath();
  ctx.roundRect(cx - size / 2, cy - size / 2, size, size / 2, 6);
  ctx.fillStyle = "rgba(255,255,255,0.1)";
  ctx.fill();
  
  ctx.restore();
}

function drawMatrix(shape, px, py, color, alpha = 1, scale = 1) {
  for (let y = 0; y < shape.length; y++) {
    for (let x = 0; x < shape[y].length; x++) {
      if (shape[y][x]) drawBlock(px + x, py + y, color, alpha, scale);
    }
  }
}

function drawBackground() {
  const danger = drama.risk;
  const redAlpha = Math.max(0, (danger - 0.45) * 0.15); // Rất nhạt

  ctx.clearRect(0, 0, VIEW_W, VIEW_H);
  ctx.fillStyle = "#07060A";
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  if (redAlpha > 0) {
    ctx.save();
    ctx.globalAlpha = redAlpha;
    ctx.fillStyle = "#d4a4b2";
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.restore();
  }

  ctx.strokeStyle = "rgba(255,255,255,0.02)";
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x++) { ctx.beginPath(); ctx.moveTo(OX + x * CELL, OY); ctx.lineTo(OX + x * CELL, OY + H * CELL); ctx.stroke(); }
  for (let y = 0; y <= H; y++) { ctx.beginPath(); ctx.moveTo(OX, OY + y * CELL); ctx.lineTo(OX + W * CELL, OY + y * CELL); ctx.stroke(); }
}

function drawBoard() {
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const cell = board[y][x];
      if (cell) drawBlock(x, y, colorOf(cell.type));
    }
  }
}

function drawGhost() {
  if (!current || !target) return;
  const plannedShape = ROTATIONS[current.type][target.rot];
  const plannedY = getGhostY(plannedShape, target.x);
  drawMatrix(plannedShape, target.x, plannedY, colorOf(current.type), 0.1, 0.95);

  if (execution.activeError) {
    const execRot = getExecutionTargetRot();
    const execX = getExecutionTargetX();
    const execShape = ROTATIONS[current.type][execRot];
    const execY = getGhostY(execShape, execX);
    drawMatrix(execShape, execX, execY, "#d4a4b2", 0.15, 0.95);
  }
}

function drawCurrent() {
  if (!current) return;
  const scale = slowmo > 0 ? 1.02 : 1;
  drawMatrix(current.shape, current.x, current.y, colorOf(current.type), 1, scale);
}

function drawFlashes() {
  for (const f of flashes) {
    const alpha = f.life / f.max;
    ctx.save();
    ctx.globalAlpha = alpha * 0.3;
    ctx.fillStyle = "#b2a4d4";
    ctx.beginPath();
    ctx.roundRect(OX, OY + f.y * CELL, W * CELL, CELL, 6);
    ctx.fill();
    ctx.restore();
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life / p.max * 0.6);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawDraggedBlock() {
  if (!dragState.active || dragState.kind !== "locked" || !dragState.type) return;
  const color = colorOf(dragState.type);
  const size = CELL - 4;
  ctx.save();
  ctx.globalAlpha = 0.9;
  ctx.beginPath();
  ctx.roundRect(dragState.px - size / 2, dragState.py - size / 2, size, size, 8);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}

function drawFallingBomb() {
  if (!fallingBomb) return;
  const px = OX + fallingBomb.x * CELL + CELL / 2;
  const py = OY + fallingBomb.y * CELL + CELL / 2;
  const r = Math.max(7, CELL * 0.42);

  ctx.save();
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = "#d4a4b2";
  ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

function drawMessages() {
  for (const m of messages) {
    const alpha = m.life / m.max;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textAlign = "center";
    ctx.font = "700 24px Quicksand, sans-serif";
    ctx.fillStyle = m.color;
    ctx.fillText(m.text, m.x, m.y);
    ctx.restore();
  }
}

function draw() {
  ctx.save();
  // Giảm tối đa biên độ rung (shake * 0.1) để luôn dịu mắt
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 0.1, (Math.random() - 0.5) * shake * 0.1);
  drawBackground();
  drawGhost();
  drawBoard();
  drawFlashes();
  drawCurrent();
  drawFallingBomb();
  drawParticles();
  drawDraggedBlock();
  drawMessages();
  ctx.restore();
}

function updateCooldownTimers(rawDt) {
  bombCooldownMs = Math.max(0, bombCooldownMs - rawDt);
  laserCooldownMs = Math.max(0, laserCooldownMs - rawDt);
  autoSaveCooldownMs = Math.max(0, autoSaveCooldownMs - rawDt);
}

function getDropInterval() {
  const intervals = [760, 600, 460, 340, 245, 175, 125, 90, 65, 45];
  return intervals[clamp(speedFactor, 1, 10) - 1];
}

function getBotInterval() {
  const intervals = [88, 72, 58, 46, 36, 29, 23, 18, 14, 11];
  return intervals[clamp(speedFactor, 1, 10) - 1];
}

function loop(time = 0) {
  const rawDt = time - lastTime || 16;
  lastTime = time;

  updateCooldownTimers(rawDt);

  if (paused) {
    updateCompactUI();
    draw();
    requestAnimationFrame(loop);
    return;
  }

  if (manualOverrideMs > 0 && manualOverrideMs < 999999) manualOverrideMs = Math.max(0, manualOverrideMs - rawDt);
  if (slowmo > 0) { slowmo -= rawDt; if (slowmo < 0) slowmo = 0; }

  updateFallingBomb(rawDt);
  botCounter += rawDt;
  dropCounter += rawDt;

  if (botCounter > getBotInterval()) { botStep(); botCounter = 0; }
  if (getDangerLevel(board) > 0.9 || getMaxHeight(board) >= H - 3) triggerAutoSave();
  if (dropCounter > getDropInterval()) { softDrop(); dropCounter = 0; }

  updateDirector(rawDt);
  updateEffects(rawDt);
  updateCompactUI();
  draw();

  requestAnimationFrame(loop);
}

function resetGame() {
  applyGridSize(sizePresetIndex);
  updateSizeUI();
  speedValue.textContent = "Mức " + speedFactor;
  board = createBoard();
  bag = []; nextQueue = []; current = null; target = null;
  score = 0; totalLines = 0; combo = 0; pieceIndex = 0;
  particles = []; flashes = []; messages = [];
  slowmo = 0; shake = 0; recoveryMode = 0;
  manualOverrideMs = aiEnabled ? 0 : 999999;
  bombCooldownMs = 0; laserCooldownMs = 0; autoSaveCooldownMs = 0;
  fallingBomb = null; paused = false;
  
  dragState.active = false; dragState.kind = null; dragState.pointerId = null;
  dragState.type = null; dragState.moved = false;
  
  execution.activeError = null; execution.lastErrorPiece = -999;
  execution.nextErrorAt = 9 + Math.floor(Math.random() * 8);

  drama.phase = PHASES.CALM; drama.risk = 0;
  drama.planText = "Dọn dẹp"; drama.controlText = "Ổn định";
  drama.lastBigEvent = "Mở màn";

  fillQueue();
  spawnPiece();
}

resetGame();
requestAnimationFrame(loop);
</script>
